map $uri $localnook_cache_control {
    default "no-cache";
    /index.html "no-store, no-cache, must-revalidate";
    "~*^/(?:[^/]+/)*[^/]+-[0-9a-z]{8,}\.(?:css|js|mjs|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif|ico)$" "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $localnook_cache_control always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
