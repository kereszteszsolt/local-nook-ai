name: localnook

services:
  angular-app:
    image: localnook-angular-app:0.3
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4201:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/index.html || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
