@if (canRender) {
  <figure class="vega-lite-chart my-4 overflow-x-auto rounded-panel border border-border-subtle bg-surface-raised p-3" [attr.aria-label]="title || description || 'Data visualization'">
    @if (title) {
      <h3 class="mb-1 text-base font-medium text-text-primary">{{ title }}</h3>
    }
    @if (description) {
      <p class="mb-3 text-sm text-text-muted">{{ description }}</p>
    }
    <div #chartHost class="min-w-fit" role="img" [attr.aria-label]="title || description || 'Data visualization'"></div>
    @if (rows.length > 0) {
      <details class="mt-3 text-sm text-text-primary">
        <summary class="cursor-pointer font-medium text-accent">View chart data as a table</summary>
        <div class="mt-2 overflow-x-auto">
          <table class="w-full border-collapse text-left">
            <thead>
              <tr>
                @for (column of columns; track column) {
                  <th class="border-b border-border-subtle px-2 py-1 font-medium">{{ column }}</th>
                }
              </tr>
            </thead>
            <tbody>
              @for (row of rows; track $index) {
                <tr>
                  @for (column of columns; track column) {
                    <td class="border-b border-border-subtle px-2 py-1">{{ displayValue(row, column) }}</td>
                  }
                </tr>
              }
            </tbody>
          </table>
        </div>
      </details>
    }
  </figure>
} @else {
  <section class="vega-lite-fallback my-4 rounded-panel border border-danger bg-danger-soft p-3 text-sm text-text-primary" role="alert">
    <p class="mb-2 font-medium">{{ fallbackMessage }}</p>
    <pre class="overflow-x-auto rounded bg-surface-raised p-2"><code class="language-json">{{ source }}</code></pre>
  </section>
}
