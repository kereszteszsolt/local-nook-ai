<div class="border border-border-subtle rounded-panel p-4 bg-surface-raised shadow-md text-lg flex flex-col gap-4 text-text-primary">
  <textarea
    cdkTextareaAutosize
    placeholder="Type your message here..."
    [(ngModel)]="currentMessage"
    (keydown)="onKeyPress($event)"
    class="w-full max-h-[350px] resize-none overflow-y-auto bg-transparent placeholder:text-text-muted focus:outline-none focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
    [disabled]="isLoading"
    aria-label="Chat message"
  ></textarea>
  <div class="flex flex-row justify-between gap-2">
    <div class="flex flex-row gap-2 items-center">
      <button mat-icon-button [disabled]="isLoading" (click)="openSystemPromptSettings()" matTooltip="Show system prompts">
        <mat-icon>notes</mat-icon>
      </button>
      <button mat-icon-button (click)="onClearInput()" [disabled]="isLoading || !currentMessage.trim()" matTooltip="Clear input">
        <mat-icon>close</mat-icon>
      </button>
      <mat-slide-toggle color="primary" [(ngModel)]="thinkEnabled" [disabled]="isLoading" class="relative top-[3px]" matTooltip="Enable or disable model thinking">
        Thinking
      </mat-slide-toggle>
    </div>
    <div class="flex flex-row gap-4 items-center">
      @if (isLoading) {
        <button mat-icon-button (click)="onAbort()" matTooltip="Stop response">
          <mat-icon class="text-xs">stop</mat-icon>
        </button>
      } @else {
        <button mat-icon-button (click)="onSendCurrentMessage()" [disabled]="!currentMessage.trim()" matTooltip="Send message">
          <mat-icon class="text-xs">send</mat-icon>
        </button>
      }
    </div>
  </div>
</div>
