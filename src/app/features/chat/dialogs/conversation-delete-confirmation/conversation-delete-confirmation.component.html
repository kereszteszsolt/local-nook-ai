<h2 mat-dialog-title>{{ data.heading }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-button class="text-danger" (click)="confirm()">{{ data.confirmLabel }}</button>
</mat-dialog-actions>
