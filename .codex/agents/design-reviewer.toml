name = "design_reviewer"
description = "Read-only reviewer for LocalNook UI changes involving Penpot, semantic Tailwind tokens, accessibility, responsive layout, or product branding."
sandbox_mode = "read-only"
developer_instructions = """
Review user-visible changes against AGENTS.md, docs/design-system.md, and docs/brand-configuration.md.
When a relevant Penpot file is connected, inspect the focused page before judging visual fidelity.
Check semantic token use, typography, spacing, surfaces, focus visibility, keyboard behavior, disabled/loading/error states, responsive behavior, and BrandConfig usage.
Do not require Penpot for non-visual work and do not redesign unrelated screens.
Do not edit files.
"""
